<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Text to Voice 🎧</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #121212, #1a1a1a);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .player {
      width: 480px;
      background: rgba(24, 24, 24, 0.9);
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }
    /* Thanh top bar */
    .topbar {
      background: #1DB954;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      color: white;
      letter-spacing: 1px;
    }
    .content {
      padding: 20px;
      text-align: center;
    }
    textarea {
      width: 100%;
      height: 480px;
      border-radius: 15px;
      padding: 14px;
      padding-right: 22px; /* chừa chỗ cho thanh cuộn */
      border: none;
      resize: none;
      margin-bottom: 20px;
      font-size: 17px;
      line-height: 1.6;
      background: #252525;
      color: #e0e0e0;
      box-sizing: border-box;

      /* Scrollbar cho Firefox */
      scrollbar-width: thin;
      scrollbar-color: #252525 #252525;
    }
    /* Scrollbar cho Chrome, Edge, Safari */
    textarea::-webkit-scrollbar {
      width: 8px;
    }
    textarea::-webkit-scrollbar-track {
      background: #252525;
    }
    textarea::-webkit-scrollbar-thumb {
      background-color: #252525; 
      border-radius: 10px;
    }
    textarea::-webkit-scrollbar-thumb:hover {
      background-color: #3a3a3a; 
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }
    .btn {
      width: 55px;   /* nhỏ hơn */
      height: 55px;  /* nhỏ hơn */
      border-radius: 50%;
      border: none;
      background: linear-gradient(45deg, #1DB954, #1ed760);
      color: white;
      font-size: 22px; /* icon nhỏ lại */
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4);
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: scale(1.1);
    }
    .progress-container {
      width: 100%;
      height: 6px;
      background: #404040;
      border-radius: 5px;
    }
    .progress {
      background: linear-gradient(90deg, #1DB954, #1ed760);
      height: 100%;
      width: 0%;
      border-radius: 5px;
      transition: width 0.1s linear;
    }
    /* Modal Save */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 12px;
      width: 300px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    }
    .modal-content h3 {
      margin-bottom: 15px;
      color: #1DB954;
    }
    .modal-content input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: none;
      background: #252525;
      color: #fff;
    }
    .modal-content button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #1DB954;
      color: white;
      cursor: pointer;
      margin: 0 5px;
    }
    .modal-content button:hover {
      background: #1ed760;
    }
  </style>
</head>
<body>
  <div class="player">
    <!-- Thanh top bar -->
    <div class="topbar">TEXT TO VOICE</div>

    <div class="content">
      <textarea id="textInput" placeholder="Nhập văn bản..."></textarea>

      <!-- Nút điều khiển -->
      <div class="controls">
        <button id="stopBtn" class="btn">⏹</button>
        <button id="playPauseBtn" class="btn">▶</button>
        <button id="saveBtn" class="btn">💾</button>
      </div>

      <!-- Thanh tiến trình -->
      <div class="progress-container">
        <div id="progressBar" class="progress"></div>
      </div>
    </div>
  </div>

  <!-- Modal Save -->
  <div id="saveModal" class="modal">
    <div class="modal-content">
      <h3>Lưu tệp TXT</h3>
      <input type="text" id="saveFileName" placeholder="Nhập tên file..." value="vanban">
      <button onclick="saveFile()">Lưu</button>
      <button onclick="closeSaveModal()">Hủy</button>
    </div>
  </div>

  <script>
    let speech = null;
    let voices = [];
    let state = "idle"; // idle | playing | paused
    let progressBar = document.getElementById("progressBar");
    let textInput = document.getElementById("textInput");
    let playPauseBtn = document.getElementById("playPauseBtn");
    let stopBtn = document.getElementById("stopBtn");
    let saveBtn = document.getElementById("saveBtn");
    let progressInterval = null;
    let progress = 0;

    // Load voices
    function loadVoices() {
      voices = window.speechSynthesis.getVoices();
    }
    window.speechSynthesis.onvoiceschanged = loadVoices;

    function startSpeech() {
      let text = textInput.value.trim();
      if (!text) {
        alert("Vui lòng nhập văn bản!");
        return;
      }
      stopSpeech(); // reset trước
      speech = new SpeechSynthesisUtterance(text);

      // mặc định tiếng Việt nếu có
      let viVoice = voices.find(v => v.lang.startsWith("vi"));
      if (viVoice) speech.voice = viVoice;

      progress = 0;
      progressBar.style.width = "0%";
      window.speechSynthesis.speak(speech);
      state = "playing";
      playPauseBtn.textContent = "⏸";

      startProgress(text);

      speech.onend = () => {
        stopSpeech();
      };
    }

    function startProgress(text) {
      clearInterval(progressInterval);
      progressInterval = setInterval(() => {
        progress += 100 / (text.length / 5);
        progressBar.style.width = Math.min(progress, 100) + "%";
      }, 200);
    }

    function pauseSpeech() {
      window.speechSynthesis.pause();
      state = "paused";
      playPauseBtn.textContent = "▶";
      clearInterval(progressInterval); // dừng thanh tiến trình
    }

    function resumeSpeech() {
      window.speechSynthesis.resume();
      state = "playing";
      playPauseBtn.textContent = "⏸";
      let text = textInput.value.trim();
      startProgress(text); // chạy tiếp từ chỗ cũ
    }

    function stopSpeech() {
      window.speechSynthesis.cancel();
      state = "idle";
      playPauseBtn.textContent = "▶";
      clearInterval(progressInterval);
      progressBar.style.width = "0%";
      progress = 0;
    }

    // Nút Play/Pause
    playPauseBtn.addEventListener("click", () => {
      if (state === "idle") {
        startSpeech();
      } else if (state === "playing") {
        pauseSpeech();
      } else if (state === "paused") {
        resumeSpeech();
      }
    });

    // Nút Stop
    stopBtn.addEventListener("click", stopSpeech);

    // Nút Save mở modal
    saveBtn.addEventListener("click", () => {
      document.getElementById("saveModal").style.display = "flex";
    });

    // Hàm lưu file
    function saveFile() {
      let text = textInput.value.trim();
      if (!text) {
        alert("Không có nội dung để lưu!");
        return;
      }
      let fileName = document.getElementById("saveFileName").value.trim() || "vanban";
      let blob = new Blob([text], { type: "text/plain" });
      let a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = fileName.endsWith(".txt") ? fileName : fileName + ".txt";
      a.click();
      closeSaveModal();
    }

    // Đóng modal
    function closeSaveModal() {
      document.getElementById("saveModal").style.display = "none";
    }

    // Click ngoài modal để đóng
    window.onclick = function(event) {
      let modal = document.getElementById("saveModal");
      if (event.target === modal) {
        closeSaveModal();
      }
    };

    // Dừng khi tắt tab
    window.addEventListener("beforeunload", stopSpeech);
  </script>
</body>
</html>
